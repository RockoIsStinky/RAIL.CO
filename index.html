<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rail.Co</title>
  </head>
  <body>
    <div id="titleContainer">
      <h1 class="interactable">Rail.Co</h1>
      <div class="interactable">
        <span>
          ><img src="AssetsNFonts/Sprites/Rocko.png" alt="Rocko" class="rocko"
        /></span>
      </div>
    </div>
    <p class="interactable">
      I Like Trains - Unrealistic Train Maker - For Crossroads
    </p>
    <div id="editorContainer">
      <p id="editorText">editor</p>
    </div>
    <div id="uiContainer" class="borderStamp">
      <div id="flexArrows">
        <button class="arrow" class="icon-btn">
          <img
            class="arrowSprite"
            src="AssetsNFonts/Sprites/Arrow.png"
            alt="arrow"
          />
        </button>
        <p id="partName">Steam</p>
        <button class="arrow invert" class="icon-btn">
          <img
            class="arrowSprite"
            src="AssetsNFonts/Sprites/Arrow.png"
            alt="arrow"
          />
        </button>
      </div>
      <div class="colorPicker">
        <div class="colorRect"></div>
        <div class="sliders">
          <div class="slider">
            <input
              id="hue"
              class="sliderDisplay"
              type="range"
              min="0"
              max="255"
              value="180"
            />
            <label for="hue"> <p class="colorVal" id="hueVal">180</p></label>
          </div>
          <div class="slider">
            <input
              id="saturation"
              class="sliderDisplay"
              type="range"
              min="0"
              max="255"
              value="180"
            />
            <label for="saturation">
              <p class="colorVal" id="saturationVal">180</p></label
            >
          </div>
          <div class="slider">
            <input
              id="value"
              class="sliderDisplay"
              type="range"
              min="0"
              max="255"
              value="180"
            />
            <label for="value">
              <p class="colorVal" id="valueVal">180</p></label
            >
          </div>
        </div>
      </div>
    </div>
    <a
      class="borderStamp"
      href="https://github.com/RockoIsStinky/RAIL.CO"
      target="_blank"
      rel="noopener noreferrer"
      >Repo</a
    >
    <div class="bottomMargin"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
